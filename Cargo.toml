[package]
name = "nix-narinfo"
version = "0.2.0"
edition = "2021"
description = "Pure Rust Nix binary-cache metadata parsing and validation"
license = "Apache-2.0"
repository = "https://github.com/cachix/nix-narinfo"
documentation = "https://docs.rs/nix-narinfo"
readme = "README.md"
keywords = ["nix", "narinfo", "binary-cache", "serialization"]
categories = ["parser-implementations", "data-structures", "cryptography"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
nix-derivation = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bench]]
name = "parse"
harness = false
